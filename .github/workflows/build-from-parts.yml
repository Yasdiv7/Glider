name: Diagnose Glider Connection

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat source_parts/part??.b64 > "$RUNNER_TEMP/glider.b64"
          base64 -d "$RUNNER_TEMP/glider.b64" > "$RUNNER_TEMP/glider.zip"
          mkdir source
          unzip -q "$RUNNER_TEMP/glider.zip" -d source
      - name: Show connection source
        shell: bash
        run: |
          echo '===== Windows MainWindow ====='
          sed -n '1,260p' source/Windows/GliderApp/MainWindow.xaml.cs
          echo '===== Windows NetworkServer ====='
          sed -n '1,320p' source/Windows/GliderApp/NetworkServer.cs
          echo '===== Android MainActivity ====='
          sed -n '1,320p' source/Android/app/src/main/java/com/glider/app/MainActivity.kt
          echo '===== Android GldProtocol ====='
          sed -n '1,320p' source/Android/app/src/main/java/com/glider/app/GldProtocol.kt
