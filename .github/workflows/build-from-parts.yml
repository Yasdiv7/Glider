name: Diagnose Glider Startup

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem source_parts\part??.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\glider.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:RUNNER_TEMP\glider.zip" -DestinationPath source

      - name: Show startup source
        shell: pwsh
        run: |
          Write-Host '===== App.xaml ====='
          Get-Content source\Windows\GliderApp\App.xaml
          Write-Host '===== App.xaml.cs ====='
          Get-Content source\Windows\GliderApp\App.xaml.cs
          Write-Host '===== GliderApp.csproj ====='
          Get-Content source\Windows\GliderApp\GliderApp.csproj
          Write-Host '===== MainWindow.xaml.cs (first 220 lines) ====='
          Get-Content source\Windows\GliderApp\MainWindow.xaml.cs | Select-Object -First 220
          Write-Host '===== MainWindow.xaml (first 220 lines) ====='
          Get-Content source\Windows\GliderApp\MainWindow.xaml | Select-Object -First 220
          Write-Host '===== Installer ====='
          Get-Content source\installer\GliderSetup.iss
