name: Build Fixed Glider Packages

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem source_parts\part??.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\glider.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:RUNNER_TEMP\glider.zip" -DestinationPath source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish source\Windows\GliderApp\GliderApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o source\publish
          if (!(Test-Path source\publish\Glider.exe)) { throw 'Glider.exe missing' }
      - name: Add FFmpeg if source contains it
        shell: pwsh
        run: |
          if (Test-Path source\Windows\GliderApp\ffmpeg\ffmpeg.exe) {
            New-Item -ItemType Directory -Force source\publish\ffmpeg | Out-Null
            Copy-Item source\Windows\GliderApp\ffmpeg\ffmpeg.exe source\publish\ffmpeg\ffmpeg.exe -Force
          }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path source\publish\* -DestinationPath Glider-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Glider-Windows-Fixed
          path: Glider-Windows-Portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat source_parts/part??.b64 > "$RUNNER_TEMP/glider.b64"
          base64 -d "$RUNNER_TEMP/glider.b64" > "$RUNNER_TEMP/glider.zip"
          mkdir source
          unzip -q "$RUNNER_TEMP/glider.zip" -d source
      - name: Patch coroutine compile error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/Android/app/src/main/java/com/glider/app/DisplayActivity.kt')
          s=p.read_text()
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if 'isActive' in line and 'currentCoroutineContext' not in line:
                  lines[i]=line.replace('isActive','kotlinx.coroutines.currentCoroutineContext().isActive')
          p.write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android APK
        working-directory: source/Android
        shell: bash
        run: gradle assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Glider-Android-Fixed
          path: source/Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
